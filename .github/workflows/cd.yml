# ============================================
# Byaboneka+ Continuous Deployment
# ============================================
# Triggers only on push to main (not PRs, not develop).
# Waits for the CI workflow to pass, then deploys to Render.
#
# Required GitHub Secret:
#   RENDER_DEPLOY_HOOK — get from Render → Service → Settings → Deploy Hook
# ============================================

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: "Deploy to Render"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Deploy backend via Render webhook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK secret not set — skipping deploy"
            echo "Set it in GitHub → Settings → Secrets → Actions"
            exit 0
          fi
          echo "🚀 Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
          echo "✅ Render deploy triggered successfully"