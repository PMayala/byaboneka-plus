# ============================================
# Byaboneka+ Continuous Integration
# ============================================
# Runs on every push and PR to main/develop.
# Validates code quality, type safety, and tests
# for both backend and frontend.
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend — Lint & Type Check
  # ============================================
  backend-lint:
    name: "Backend: Lint & Type Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
        continue-on-error: true

  # ============================================
  # Frontend — Lint & Build
  # ============================================
  frontend-build:
    name: "Frontend: Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ============================================
  # Backend — Unit Tests
  # ============================================
  backend-test-unit:
    name: "Backend: Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test

  # ============================================
  # Frontend — Unit Tests
  # ============================================
  frontend-test:
    name: "Frontend: Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
        env:
          NODE_ENV: test

  # ============================================
  # Backend — Integration Tests
  # ============================================
  backend-test-integration:
    name: "Backend: Integration Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: byaboneka_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: byaboneka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx ts-node src/migrations/run.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://byaboneka_test:test_password@localhost:5432/byaboneka_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://byaboneka_test:test_password@localhost:5432/byaboneka_test
          JWT_SECRET: test_jwt_secret_min_32_characters_long_for_ci!!
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_long_for_ci!!
          CORS_ORIGIN: http://localhost:3000

  # ============================================
  # Backend — Test Coverage
  # ============================================
  backend-coverage:
    name: "Backend: Coverage Report"
    runs-on: ubuntu-latest
    needs: [backend-test-unit]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/